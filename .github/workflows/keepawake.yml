name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "31 */6 * * *"   
  workflow_dispatch:          

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Visit app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          import time

          URL = "https://movies-dataset-g68dfeaf04.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              time.sleep(15)

              # Si está dormida, clic en el botón de despertar
              wake_btn = page.locator("text=Yes, get this app back up!")
              if wake_btn.count() > 0:
                  wake_btn.first.click()
                  print("App estaba dormida → despertando...")
                  page.wait_for_load_state("networkidle", timeout=120000)
              else:
                  print("App ya estaba activa.")

              browser.close()
          EOF   